server {
    listen 80;
    server_name localhost;

    # Membatasi 10 koneksi bersamaan dari 1 IP yang sama
    limit_conn conn_limit 10;

    location / {
        # Menerapkan rate limit (10 req/s, dengan toleransi antrean 20)
        limit_req zone=api_limit burst=20 nodelay;

        # Meneruskan traffic ke container Go Fiber
        proxy_pass http://app-api:8080;
        
        # Standar Header Reverse Proxy agar Go Fiber tahu IP asli user (bukan IP Nginx)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pengaturan Timeout agar Nginx tidak cepat memutus koneksi jika DB lambat
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Tolak akses ke file tersembunyi (seperti .env, .git) demi keamanan
    location ~ /\.(?!well-known).* {
        deny all;
    }
}